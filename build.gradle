buildscript {
    // The axion-release plugin (at its latest, 1.21.2) pulls Bouncy Castle 1.81/1.82 onto the
    // plugin classpath, below the 1.84 that fixes GHSA-p93r-85wp-75v3, -cj8j-37rh-8475,
    // -c3fc-8qff-9hwx and -wg6q-6289-32hp. Force the patched version until axion-release ships it.
    // Build-time only; not part of the published artifact.
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.84',
                    'org.bouncycastle:bcpg-jdk18on:1.84',
                    'org.bouncycastle:bcpkix-jdk18on:1.84',
                    'org.bouncycastle:bcutil-jdk18on:1.84'
        }
    }
}

plugins {
    id 'pl.allegro.tech.build.axion-release' version '1.20.1'
    id "com.palantir.revapi" version "1.7.0" apply false
    id 'biz.aQute.bnd.builder' version "$bndVersion" apply false
    id 'com.vanniktech.maven.publish' version '0.34.0' apply false
}

scmVersion {
    tag {
        prefix = 'ical4j-connector-'
    }
    versionCreator 'versionWithBranch'
    branchVersionCreator = [
            'master': 'simple',
            'develop': 'simple',
    ]
    nextVersion {
        suffix = 'pre'
        separator = '-'
    }
}

// Modules with no release at revApiOldVersion have no baseline for revapi to compare against.
// Remove a module from this list once a release that includes it has been published.
def revApiExcludedProjects = ['ical4j-connector-google', 'ical4j-connector-msgraph']

configure(subprojects) {
    apply plugin: 'java-library'
    apply plugin: 'groovy'
    if (!(name in revApiExcludedProjects)) {
        apply plugin: 'com.palantir.revapi'

        revapi {
            oldVersion = revApiOldVersion
        }
    }
    apply plugin: 'biz.aQute.bnd.builder'
    apply plugin: 'com.vanniktech.maven.publish'

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }

    group = 'org.ical4j'
    description = '''\
A Java library for accessing iCalendar data stores
'''
    version = rootProject.scmVersion.version

    java {
        sourceCompatibility = 11
        targetCompatibility = 11
    }

    dependencies {

        annotationProcessor 'org.osgi:osgi.core:8.0.0',
                'org.osgi:org.osgi.service.component.annotations:1.5.0',
                'org.osgi:org.osgi.service.metatype.annotations:1.4.1',
                'org.osgi:org.osgi.annotation:6.0.0'

        // spock
        testImplementation platform(libs.spock.bom), libs.commons.io, libs.spock.core

        // junit
//        testImplementation "org.junit.vintage:junit-vintage-engine:$junitVintageVersion"

        // testcontainers
        testImplementation libs.testcontainers, libs.testcontainers.spock

        testImplementation libs.log4j.core, libs.log4j.slf4j2
    }

    jar {
        manifest {
            attributes (
                    'Implementation-Title': 'iCal4j Connector',
                    'Implementation-Version': archiveVersion,
                    'Implementation-Vendor': 'Ben Fortuna'
            )
        }
    }

    test {
        useJUnitPlatform()
    }

    javadoc {
        if (JavaVersion.current().isJava8Compatible()) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
        options {
            links 'https://docs.oracle.com/en/java/javase/11/docs/api/',
                'https://javadoc.io/doc/org.mnode.ical4j/ical4j/latest',
                'https://javadoc.io/doc/org.mnode.ical4j/ical4j-vcard/latest',
                'https://javadoc.io/doc/org.apache.httpcomponents/httpclient/latest',
                'https://javadoc.io/doc/org.apache.jackrabbit/jackrabbit-webdav/2.22.2'
        }
    }

    // Publishing to the Sonatype Central Portal is configured via the vanniktech plugin.
    // Host, auto-release and signing toggles live in gradle.properties
    // (SONATYPE_HOST, SONATYPE_AUTOMATIC_RELEASE, RELEASE_SIGNING_ENABLED).
    // Credentials and the signing key are supplied via ORG_GRADLE_PROJECT_* env vars in CI.
    mavenPublishing {
        coordinates(group.toString(), project.name, version.toString())

        pom {
            name = project.name
            description = project.description
            url = 'http://ical4j.github.io'

            licenses {
                license {
                    name = 'iCal4j - License'
                    url = 'https://raw.githubusercontent.com/ical4j/ical4j/master/LICENSE'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'fortuna'
                    name = 'Ben Fortuna'
                }
            }

            scm {
                url = 'https://github.com/ical4j/ical4j-connector'
                connection = 'scm:git@github.com:ical4j/ical4j-connector.git'
                developerConnection = 'scm:git@github.com:ical4j/ical4j-connector.git'
            }
        }
    }
}
